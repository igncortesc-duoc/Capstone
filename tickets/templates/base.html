{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}TIX AI{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            

            <a
                class="navbar-brand fw-bold"
                href="{% url 'dashboard' %}"
            >
            <img src="{% static 'AAAA_LOGO_TIXAI.png' %}" alt="Foto" id="logo" width="40">
                TIX AI
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'dashboard' %}"
                        >
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'lista_tickets' %}"
                        >
                            Tickets
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{% url 'nuevo_ticket' %}"
                        >
                            Nuevo Ticket
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <main class="container py-5">

        {% block content %}
        {% endblock %}

    </main>


    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% block extra_js %}
{% endblock %}

</body>
</html>
