{% extends 'base.html' %}

{% block title %}
Iniciar sesión - TIX AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="mb-1">
                    Iniciar sesión
                </h1>

                <p class="text-muted mb-4">
                    Ingresa tus credenciales para continuar.
                </p>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Correo o contraseña incorrectos.
                </div>
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="id_username">
                            Correo
                        </label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="id_password">
                            Contraseña
                        </label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button type="submit" class="btn btn-primary w-100">
                        Ingresar
                    </button>

                </form>

                <p class="text-center text-muted mt-3 mb-0">
                    ¿No tienes cuenta?
                    <a href="{% url 'register' %}">Regístrate</a>
                </p>

            </div>
        </div>
    </div>
</div>

{% endblock %}
