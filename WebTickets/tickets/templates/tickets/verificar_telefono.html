{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-5 text-center">
        <h2 class="fw-bold">Verificar Teléfono</h2>
        <p class="text-muted">Revisa la consola de tu servidor para ver el código SMS simulado.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="card p-4 shadow-sm border-0" style="border-radius: 14px;">
            {% csrf_token %}
            <input type="text" name="codigo" class="form-control form-control-lg mb-3 text-center fw-bold" placeholder="000000" maxlength="6" style="letter-spacing: 4px;" required>
            <button type="submit" class="btn btn-success btn-lg">Confirmar y Activar 2FA</button>
        </form>
    </div>
</div>
{% endblock %}
