{% extends 'base.html' %}

{% block title %}
Nuevo Ticket - TIX AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h1 class="mb-1">
                    Nuevo Ticket
                </h1>

                <p class="text-muted mb-4">
                    Describe tu problema y el sistema clasificará automáticamente el ticket.
                </p>


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Asunto
                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            placeholder="Ejemplo: No puedo conectarme al WiFi"
                            maxlength="150"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea
                            name="descripcion"
                            class="form-control"
                            rows="7"
                            placeholder="Describe detalladamente el problema..."
                            maxlength="1000"
                            required
                        ></textarea>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Analizar y crear ticket
                        </button>


                        
                        <a href="{% url 'dashboard' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
